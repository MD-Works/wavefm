// ── FULLSCREEN ────────────────────────────────────────────────────────────────
let _fsOpen = false;

function toggleFullscreen() {
  _fsOpen ? closeFs() : openFs();
}

function openFs() {
  _fsOpen = true;
  const overlay = document.getElementById('fs-overlay');
  overlay.classList.add('open');

  // Sync button icons
  document.getElementById('fs-icon-expand').style.display = 'none';
  document.getElementById('fs-icon-shrink').style.display = '';

  // Try native browser fullscreen on the overlay element
  if (overlay.requestFullscreen) {
    overlay.requestFullscreen().catch(() => {}); // graceful fallback if blocked
  } else if (overlay.webkitRequestFullscreen) {
    overlay.webkitRequestFullscreen();
  }

  // Populate overlay with current track info
  syncFsContent();
  document.body.style.overflow = 'hidden';
}

function closeFs() {
  _fsOpen = false;
  const overlay = document.getElementById('fs-overlay');
  overlay.classList.remove('open');

  // Restore button icons
  document.getElementById('fs-icon-expand').style.display = '';
  document.getElementById('fs-icon-shrink').style.display = 'none';

  // Exit native fullscreen if active
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document).catch(() => {});
  }

  document.body.style.overflow = '';
}

// Sync the overlay content whenever it opens or the track changes
function syncFsContent() {
  if (!_fsOpen) return;

  const ch  = CHANNELS[currentChannelIdx];
  const vid = ch?.videos?.[currentTrackIdx];

  // Station / channel info
  document.getElementById('fs-ch-icon').textContent = ch?.icon ?? '';
  document.getElementById('fs-ch-name').textContent = ch?.name ?? '';
  document.getElementById('fs-ch-freq').textContent = ch?.freq ? '· ' + ch.freq : '';

  // Track info
  document.getElementById('fs-track-title').textContent   = vid?.title ?? '—';
  document.getElementById('fs-track-channel').textContent = ch ? ch.icon + ' ' + ch.name : '';

  const dedEl = document.getElementById('fs-track-dedication');
  if (vid?.dedication) {
    dedEl.textContent = '💌 ' + vid.dedication + (vid.requestedBy ? ' — ' + vid.requestedBy : '');
    dedEl.style.display = 'block';
  } else {
    dedEl.style.display = 'none';
  }

  // Artwork — use YouTube maxres thumbnail
  const artInner = document.getElementById('fs-artwork-inner');
  if (vid?.id) {
    artInner.innerHTML = `<img src="https://img.youtube.com/vi/${vid.id}/hqdefault.jpg"
      onerror="this.style.display='none'; this.nextElementSibling.style.display=''"
      alt="${vid.title ?? ''}">
      <div class="fs-artwork-placeholder" style="display:none;position:absolute">🎵</div>`;
  } else {
    artInner.innerHTML = `<div class="fs-artwork-placeholder">🎵</div>`;
  }

  // Controls — mirror which set is visible
  const isSynced = ch?.synced ?? true;
  document.getElementById('fs-controls-synced').style.display  = isSynced ? 'flex' : 'none';
  document.getElementById('fs-controls-ondemand').style.display = isSynced ? 'none' : 'flex';

  syncFsMuteBtn();
  syncFsPlayBtn();

  // Rating thumbs
  updateFsRatingUI(vid?.id ?? null);
}

function syncFsMuteBtn() {
  const btn = document.getElementById('fs-mute-btn');
  if (!btn) return;
  // Mirror the main mute button text
  const mainBtn = document.getElementById('mute-btn');
  if (mainBtn) btn.textContent = mainBtn.textContent;
}

function syncFsPlayBtn() {
  const btn = document.getElementById('fs-play-pause-btn');
  if (!btn) return;
  const mainBtn = document.getElementById('play-pause-btn');
  if (mainBtn) btn.textContent = mainBtn.textContent;
}

// Rating UI inside the fullscreen overlay (mirrors main bar logic)
function updateFsRatingUI(videoId) {
  const panel  = document.getElementById('fs-rating');
  const upBtn  = document.getElementById('fs-thumb-up');
  const dnBtn  = document.getElementById('fs-thumb-down');
  if (!panel) return;

  if (!videoId) { panel.style.display = 'none'; return; }
  panel.style.display = 'flex';

  const votes   = getSavedVotes();
  const existing = votes[videoId];
  upBtn.classList.toggle('voted', existing === 'up');
  dnBtn.classList.toggle('voted', existing === 'down');
  upBtn.disabled = !!existing;
  dnBtn.disabled = !!existing;
  upBtn.title  = existing === 'up'   ? 'You liked this' : 'Thumbs up';
  dnBtn.title  = existing === 'down' ? 'You disliked this' : 'Thumbs down';
}

// Sync volume slider in overlay with main slider
document.getElementById('volume-slider').addEventListener('input', function() {
  const fsSlider = document.getElementById('fs-volume-slider');
  if (fsSlider) fsSlider.value = this.value;
});

// Keyboard shortcut: F toggles fullscreen
document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    // Don't trigger inside input fields
    if (['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
    toggleFullscreen();
  }
});

// Sync when browser exits native fullscreen via Esc
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && _fsOpen) closeFs();
});
document.addEventListener('webkitfullscreenchange', () => {
  if (!document.webkitFullscreenElement && _fsOpen) closeFs();
});

// ── SHARING ───────────────────────────────────────────────────────────────────
const BASE_URL = 'https://wavefm-569.pages.dev';

let _shareState = { url: '', title: '', message: '' };

// Build a share URL for a single track by video ID
function buildTrackUrl(videoId) {
  return `${BASE_URL}/?v=${videoId}`;
}

// Build a share URL for a temporary playlist (up to ~30 tracks before URL gets long)
function buildPlaylistUrl(videoIds) {
  return `${BASE_URL}/?pl=${videoIds.join(',')}`;
}

// Format the WhatsApp message text
function buildWaMessage(title, url) {
  return `🎵 *${title}*\n\nListening on WAVEFM — open the link to tune in:\n${url}`;
}

// Open the share modal for a track from channel+index
function shareTrack(ci, vi) {
  const ch = CHANNELS[ci];
  const v  = ch.videos[vi];
  if (!v) return;
  openShareModal(v.title, buildTrackUrl(v.id));
}

// Share a track we only know by videoId + title (from a playlist)
function shareTrackById(videoId, title) {
  openShareModal(title, buildTrackUrl(videoId));
}

// Share an entire private playlist by encoding video IDs in the URL
function sharePlaylist(plId) {
  const pl = getPlaylists().find(p => p.id === plId);
  if (!pl || !pl.tracks.length) return;
  const ids  = pl.tracks.map(t => t.videoId);
  const url  = buildPlaylistUrl(ids);
  const title = `${pl.name} (${pl.tracks.length} track${pl.tracks.length === 1 ? '' : 's'})`;
  openShareModal(title, url, true);
}

function openShareModal(title, url, isPlaylist) {
  const message = buildWaMessage(title, url);
  _shareState = { url, title, message };

  document.getElementById('share-modal-label').textContent = isPlaylist ? 'Share Playlist' : 'Share Track';
  document.getElementById('share-modal-track').textContent = title;
  document.getElementById('share-url-box').textContent = url;
  document.getElementById('share-preview').textContent = message;
  document.getElementById('share-copy-btn').textContent = 'Copy Link';

  document.getElementById('share-modal-backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function hideShareModal() {
  document.getElementById('share-modal-backdrop').classList.remove('open');
  document.body.style.overflow = '';
}

function closeShareModal(e) {
  // Only close when clicking the backdrop itself, not the modal card
  if (e.target === document.getElementById('share-modal-backdrop')) hideShareModal();
}

function openWhatsApp() {
  const encoded = encodeURIComponent(_shareState.message);
  window.open(`https://wa.me/?text=${encoded}`, '_blank', 'noopener');
}

function copyShareLink() {
  navigator.clipboard.writeText(_shareState.url).then(() => {
    const btn = document.getElementById('share-copy-btn');
    btn.textContent = 'Copied ✓';
    setTimeout(() => btn.textContent = 'Copy Link', 2000);
  }).catch(() => {
    // Fallback: select the URL box text
    const box = document.getElementById('share-url-box');
    const range = document.createRange();
    range.selectNodeContents(box);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideShareModal();
});

// ── INBOUND SHARE URL HANDLING ────────────────────────────────────────────────
// Reads ?v=VIDEO_ID or ?pl=ID1,ID2,ID3 from the URL on page load.
// Returns a descriptor of what was requested so boot() can act on it.
function parseShareParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.has('v')) {
    return { type: 'track', videoId: params.get('v').trim() };
  }
  if (params.has('pl')) {
    const ids = params.get('pl').split(',').map(s => s.trim()).filter(s => /^[a-zA-Z0-9_-]{11}$/.test(s));
    if (ids.length) return { type: 'playlist', ids };
  }
  return null;
}

// Called from boot() after CHANNELS are loaded.
// Finds the shared track/playlist in the channel data and plays it.
function handleShareParams(share) {
  if (!share) return false;

  if (share.type === 'track') {
    // Find which channel+index has this video ID
    for (let ci = 0; ci < CHANNELS.length; ci++) {
      const vi = CHANNELS[ci].videos.findIndex(v => v.id === share.videoId);
      if (vi !== -1) {
        switchChannel(ci);
        currentTrackIdx = vi;
        loadTrack(ci, vi);
        showTempPlBanner(`▶ Opened shared track`);
        _shareHandled = true;
        return true;
      }
    }
    // Video not in any channel — play it as a standalone temp track via YouTube directly
    // We know the video ID but not the title; use a placeholder title
    showTempPlBanner(`▶ Playing shared track`);
    _shareHandled = true;
    // Create a virtual "Shared" channel in memory (not persisted) for playback
    const tempCh = {
      id: '__shared__', icon: '🔗', name: 'Shared', freq: '', desc: '', synced: false,
      videos: [{ id: share.videoId, title: 'Shared track', dur: 240 }]
    };
    CHANNELS.push(tempCh);
    buildSidebar();
    const ci = CHANNELS.length - 1;
    switchChannel(ci);
    return true;
  }

  if (share.type === 'playlist') {
    // Build tracks from IDs — look each one up in CHANNELS for a title, fall back to ID
    const tracks = share.ids.map(id => {
      for (const ch of CHANNELS) {
        const v = ch.videos.find(vv => vv.id === id);
        if (v) return { id, title: v.title, dur: v.dur || 240 };
      }
      return { id, title: id, dur: 240 }; // title unknown; will show video ID until YT loads
    });

    if (!tracks.length) return false;

    // Inject as a virtual on-demand channel (in memory only, not persisted)
    const tempCh = {
      id: '__shared_pl__', icon: '🔗', name: 'Shared Playlist', freq: '', desc: '',
      synced: false,
      videos: tracks.map(t => ({ id: t.id, title: t.title, dur: t.dur }))
    };
    CHANNELS.push(tempCh);
    buildSidebar();
    const ci = CHANNELS.length - 1;
    switchChannel(ci);
    _shareHandled = true;
    showTempPlBanner(`🔗 Playing shared playlist — ${tracks.length} track${tracks.length === 1 ? '' : 's'}`);
    return true;
  }

  return false;
}

function showTempPlBanner(msg) {
  const el = document.getElementById('temp-pl-banner');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

boot();
</script>

        <button class="thumb-btn" id="fs-thumb-down" onclick="castVote('down')" title="Thumbs down">👎</button>
      </div>
      <div class="fs-vol-wrap">
        <span class="vol-icon">🔊</span>
        <input type="range" id="fs-volume-slider" min="0" max="100" value="80" oninput="setVolume(this.value); document.getElementById('volume-slider').value=this.value" />
      </div>
    </div>
  </div>
</div>
